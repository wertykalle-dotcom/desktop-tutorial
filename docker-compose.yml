# YOSLA beta stack.
#
# Default:
#   docker compose up --build
#
# Optional TURN server for WebRTC NAT traversal:
#   docker compose --profile turn up --build
#
# PostgreSQL is included as internal infrastructure, but the current backend
# still keeps its primary local persistence in SQLite unless DATABASE_URL is
# explicitly enabled and the remaining repository paths are migrated.

services:
  postgres:
    image: postgres:16-alpine
    container_name: yosla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yosla_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
      POSTGRES_DB: ${POSTGRES_DB:-yosla_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yosla_admin} -d ${POSTGRES_DB:-yosla_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: yosla_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yosla_backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - backend/.env.example
    environment:
      DATABASE_PATH: /data/yosla.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-test@test.com}
    volumes:
      - backend-data:/data
      - backend-uploads:/app/backend/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: yosla_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  turn:
    image: coturn/coturn:latest
    container_name: yosla_turn
    restart: unless-stopped
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-yosla.local}
      - --user=${TURN_USER:-yosla}:${TURN_PASSWORD:-change-me-before-production}
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    profiles:
      - turn

volumes:
  backend-data:
  backend-uploads:
  postgres-data:
  redis-data:
